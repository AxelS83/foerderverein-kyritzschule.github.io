# Set theme
theme: alembic-jekyll-theme

# File excludes
exclude:
- README.md
- Gemfile
- Gemfile.lock
- netlify.toml

# Set plugins
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-commonmark
- jekyll-include-cache
- jemoji

# Site settings
url: "https://foerderverein-kyritzschule.de"
baseurl: ""
lang: "de-DE"
timezone: "Europe/Berlin"
title: "Förderverein der Kyritzschule Darmstadt e.V."
description: "Schulprojekte, Lernmaterialien und Gemeinschaft an der Kyritzschule in Darmstadt."
permalink: pretty
logo: "/pictures/logo.png"
image: "/pictures/header.png"
email: "foerderverein-kyritzschule@web.de"
google_site_verification: "8AblM4LRJDTqoubdCky7n8fIqkrZjApEL-FSguDHvo0"

address:
  street: "Emilstraße 10"
  postal_code: "64289"
  city: "Darmstadt"
  region: "Hessen"
  country: "DE"

keywords:
- "Förderverein"
- "Kyritzschule"
- "Kyritzschule Darmstadt"
- "Förderverein Kyritzschule Darmstadt"
- "Darmstadt"
- "Grundschule"
- "Schule"
- "Schulförderverein"
- "Elternverein"
- "Schulprojekte"
- "Lernmaterialien"
- "Spenden"
- "Mitglied werden"
- "Schulgemeinschaft"
- "Emilstraße"

manifest:
  lang: "de-DE"
  name: "Förderverein der Kyritzschule Darmstadt e.V."
  short_name: "FV Kyritzschule"
  theme_color: "#5c4930"
  background_color: "#fffdf9"

# Pagination
paginate: 5
paginate_path: blog/page:num

# Header nav
navigation_header:
- title: Über uns
  url: /#ueber-uns
- title: Mitglied werden
  url: /#mitglied-werden
- title: Spenden
  url: /#spenden
- title: Projekte
  url: /#projekte
- title: Kontakt
  url: /#kontakt

# Footer nav
navigation_footer:
#- title: Back to top
#  url: "#top"
- title: Impressum
  url: /impressum/

# Collections
collections:
  posts:
    title: Aktuelles
    output: true
    description: "Aktuelle Projekte, Veranstaltungen und Neuigkeiten des Fördervereins der Kyritzschule Darmstadt e.V."
    feature_text: |
      Aktuelles aus dem Förderverein
    feature_image: "/pictures/header.png"

# Collection settings
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page
